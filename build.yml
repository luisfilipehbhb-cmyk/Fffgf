name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Copiar o site para www
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Ícone do app (se existir assets/icon.png)
        run: |
          if [ -f assets/icon.png ]; then
            npx --yes @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#000000'
          else
            echo "Sem assets/icon.png, usando o ícone padrão"
          fi

      - name: Permissões de arquivos no manifesto
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <application android:requestLegacyExternalStorage="true"#' android/app/src/main/AndroidManifest.xml
          grep -n "EXTERNAL_STORAGE\|requestLegacy" android/app/src/main/AndroidManifest.xml

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
